[project]
name = "hough-transform"
version = "1.0.0"
description = "From-scratch Hough Transform for detecting lines and circles in images."
authors = [{ name = "Luan Nunes Utimura", email = "lnutimura@hotmail.com.br" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
]

[project.scripts]
hough = "hough_transform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
